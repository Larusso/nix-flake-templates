name: Nix repo flake tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [openspec, rust, rust-bin, rust-lib, rust-openspec, rust-bin-openspec, rust-lib-openspec, oh-my-cloudecode, oh-my-codex]
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Run repo flake tests
        run: ./tests/${{ matrix.check }}/test.sh
