name: Update template flake locks

on:
  schedule:
    # Weekly on Sunday 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Update flake locks in each template
        run: |
          for dir in templates/*/; do
            if [[ -f "$dir/flake.nix" ]]; then
              echo "==> Updating $dir"
              (cd "$dir" && nix flake update)
            fi
          done

      - name: Run template tests
        run: ./tests/run-all.sh

      - name: Create PR if there are changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to template flake locks"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="chore/update-template-flakes-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          git add templates/
          git commit -m "chore: update template flake locks"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "chore: update template flake locks" --body "Automated update of template flake inputs and locks. Tests passed in this workflow. Merge is handled by GitHub settings (e.g. auto-merge when required checks pass)."
