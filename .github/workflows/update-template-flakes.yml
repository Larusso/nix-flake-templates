name: Update repo flake locks

on:
  schedule:
    # Weekly on Sunday 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Update flake locks in each template and helper flake
        run: |
          for dir in templates/*/; do
            if [[ -f "$dir/flake.nix" ]]; then
              echo "==> Updating $dir"
              (cd "$dir" && nix flake update)
            fi
          done
          for dir in flakes/*/; do
            if [[ -f "$dir/flake.nix" ]]; then
              echo "==> Updating $dir"
              (cd "$dir" && nix flake update)
            fi
          done
          nix flake lock

      - name: Run repo flake tests
        run: ./tests/run-all.sh

      - name: Create PR if there are changes
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: chore/update-repo-flakes
          commit-message: "chore: update repo flake locks"
          title: "chore: update repo flake locks"
          body: >
            Automated update of template and helper-flake inputs and locks. Tests passed in
            this workflow. Merge is handled by GitHub settings (e.g. auto-merge
            when required checks pass).
          add-paths: |
            flake.lock
            templates/**
            flakes/**
