name: Update template flake locks

on:
  schedule:
    # Weekly on Sunday 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Update flake locks in each template
        run: |
          for dir in templates/*/; do
            if [[ -f "$dir/flake.nix" ]]; then
              echo "==> Updating $dir"
              (cd "$dir" && nix flake update)
            fi
          done

      - name: Run template tests
        run: ./tests/run-all.sh

      - name: Create PR if there are changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/update-template-flakes
          commit-message: chore: update template flake locks
          title: chore: update template flake locks
          body: >
            Automated update of template flake inputs and locks. Tests passed in
            this workflow. Merge is handled by GitHub settings (e.g. auto-merge
            when required checks pass).
          add-paths: |
            templates/**
